<title id="t">Fora do código — etiqueta interna</title>
<desc id="d">Etiqueta de roupa com o que Ryan faz fora do código: ouvindo Ecco2k, Playboi Carti e bleood; assistindo Akira e Cyberpunk: Edgerunners; jogando Phantom Blade Zero; lendo história de Ugarit, El e Asherah; na quadra, tênis de mesa (iniciante) e vôlei. Lavar à mão, não secar no sol do meio-dia de São Paulo.</desc>
