<svg xmlns="http://www.w3.org/2000/svg" width="960" height="56" viewBox="0 0 960 56" role="img" aria-labelledby="t">
<title id="t">Tecnologias</title>
<defs>
<clipPath id="cl"><rect width="960" height="56" rx="14"/></clipPath>
<filter id="nz" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .91 0 0 0 0 .85 0 0 0 0 .74 0 0 0 -1.6 1.1"/></filter>
<path id="s8" d="M0 -10L1.61 -3.88L7.07 -7.07L3.88 -1.61L10 0L3.88 1.61L7.07 7.07L1.61 3.88L0 10L-1.61 3.88L-7.07 7.07L-3.88 1.61L-10 0L-3.88 -1.61L-7.07 -7.07L-1.61 -3.88Z"/>
<pattern id="mh" patternUnits="userSpaceOnUse" x="336" y="29" width="24" height="9"><path d="M0 9V6H3V3H6V0H10V3H13V6H16V9Z" fill="#24427a"/></pattern>
<radialGradient id="glw"><stop offset="0" stop-color="#f1cf7a" stop-opacity=".55"/><stop offset=".45" stop-color="#c9a24a" stop-opacity=".18"/><stop offset="1" stop-color="#c9a24a" stop-opacity="0"/></radialGradient></defs>
<style>
.ins{font-family:Georgia,'Times New Roman',serif;text-transform:uppercase}

.sp{opacity:0;transform-box:fill-box;transform-origin:center;animation:tw 2.8s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.2) rotate(0)}45%{opacity:1;transform:scale(1) rotate(45deg)}70%{opacity:.15;transform:scale(.5) rotate(70deg)}}
.gl{transform-box:fill-box;transform-origin:center;animation:gl 3.6s ease-in-out infinite}
@keyframes gl{0%,100%{opacity:.25;transform:scale(.85)}50%{opacity:.8;transform:scale(1.1)}}
.rs{transform-box:fill-box;transform-origin:center;animation:rs 60s linear infinite}
@keyframes rs{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sp{animation:none!important;opacity:0}.gl{animation:none!important;opacity:.4}.rs{animation:none!important}}

.gd{animation:gd 3.4s ease-in-out infinite}
.gd2{animation:gd2 3.4s ease-in-out infinite}
@keyframes gd{0%,100%{filter:brightness(1)}50%{filter:brightness(1.4) drop-shadow(0 0 2.5px rgba(241,207,122,.8))}}
@keyframes gd2{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3)}}
@media (prefers-reduced-motion:reduce){.gd,.gd2{animation:none!important}}
</style>
<rect width="960" height="56" rx="14" fill="#1c1712"/>
<g clip-path="url(#cl)">
<circle class="gl" cx="52" cy="29" r="14" fill="url(#glw)" style="animation-delay:1s"/><use class="gd" href="#s8" transform="translate(52 29) scale(0.7)" fill="#c9a24a" style="animation-delay:0.00s"/><g transform="translate(43 21) scale(0.55)"><path class="sp" d="M0 -5L1 -1L5 0L1 1L0 5L-1 1L-5 0L-1 -1Z" fill="#f6e3a8" style="animation-delay:1.00s"/></g><g transform="translate(61 36) scale(0.45)"><path class="sp" d="M0 -5L1 -1L5 0L1 1L0 5L-1 1L-5 0L-1 -1Z" fill="#f6e3a8" style="animation-delay:2.30s"/></g>
<text x="72" y="35" class="ins" font-size="16" letter-spacing="8" fill="#e9d9bd">TECNOLOGIAS</text>
<rect x="336" y="29" width="568" height="9" fill="url(#mh)"/>
<line class="gd" x1="336" y1="38.5" x2="912" y2="38.5" stroke="#c9a24a" stroke-opacity="0.5" style="animation-delay:0.53s"/>
<rect width="960" height="56" filter="url(#nz)" opacity=".16"/>
</g>
<rect x=".5" y=".5" width="959" height="55" rx="13.5" fill="none" stroke="#3a2f24"/>
</svg>
